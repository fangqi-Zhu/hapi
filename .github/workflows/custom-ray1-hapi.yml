name: Custom ray1 HAPI

on:
  workflow_dispatch:
  push:
    branches:
      - custom/ray1-terminal
    paths:
      - "cli/**"
      - "hub/**"
      - "shared/**"
      - "web/**"
      - "scripts/ray1/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/custom-ray1-hapi.yml"

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun typecheck
      - run: bun run test
      - run: bun run build:single-exe
      - uses: actions/upload-artifact@v4
        with:
          name: hapi-custom-ray1-linux-x64
          path: cli/dist-exe/bun-linux-x64-baseline/hapi
          if-no-files-found: error
